name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Тесты
        run: dotnet test --project tests/RobloxAntiAfk.Core.Tests

      - name: Сборка exe
        run: >
          dotnet publish src/RobloxAntiAfk.App -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o dist

      # Roblox здесь нет, а приложение открывается выключенным, поэтому ничего не нажимает.
      - name: Проверка запуска
        shell: pwsh
        run: |
          $app = Start-Process -FilePath "dist\RobloxAntiAFK.exe" -PassThru
          Start-Sleep -Seconds 20
          if ($app.HasExited) {
            Write-Error "Приложение закрылось само, код выхода: $($app.ExitCode)"
            exit 1
          }
          $app.Refresh()
          Write-Host "Приложение работает, заголовок окна: '$($app.MainWindowTitle)'"
          Stop-Process -Id $app.Id -Force

      # Распознавание в собранном exe на настоящей Windows. Сбой распознавания роняет сборку,
      # а снимок и подпись зависят от рабочего стола машины, поэтому только выводят предупреждение.
      - name: Проверка перевода
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "self-test.txt"
          $app = Start-Process -FilePath "dist\RobloxAntiAFK.exe" -ArgumentList "--self-test=$report" -PassThru -Wait
          if (Test-Path $report) { Get-Content $report } else { Write-Host "Отчёта нет" }
          if ((Test-Path $report) -and (Select-String -Path $report -Pattern "^WARN" -Quiet)) { Write-Host "::warning::Снимок или подпись не прошли проверку, смотри отчёт выше" }
          if ($app.ExitCode -ne 0) {
            Write-Error "Проверка перевода не прошла, код выхода: $($app.ExitCode)"
            exit 1
          }

      - uses: actions/upload-artifact@v7
        with:
          name: roblox-antiafk-windows
          path: dist/RobloxAntiAFK.exe

  macos:
    name: macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Тесты
        run: dotnet test --project tests/RobloxAntiAfk.Core.Tests

      - name: Сборка приложения
        run: dotnet publish src/RobloxAntiAfk.App -c Release -r osx-arm64 --self-contained -o dist
